[tools]
"aqua:temporalio/cli" = "1.10.0"
node = "26.13.1"
pnpm = "12.21.0"

[tools."github:ymm-oss/fsl"]
version = "5.1.0"
bin = "fslc"
os = ["linux", "macos/arm64", "windows"]

[tools."github:ymm-oss/fsl".platforms]
linux-arm64 = { asset_pattern = "fslc-linux-arm64" }
linux-x64 = { asset_pattern = "fslc-linux-x64" }
macos-arm64 = { asset_pattern = "fslc-macos-arm64" }
windows-x64 = { asset_pattern = "fslc-windows-x64.exe" }
